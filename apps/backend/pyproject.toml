[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "formlane-backend"
version = "0.1.0"
description = "Formlane Python API and durable CrewAI execution backed by PostgreSQL."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.1",
  "crewai==1.15.40",
  "dbos==3.5.0",
  "fastapi==0.162.5",
  "httpx==0.28.1",
  "playwright==1.65.1",
  "psycopg[binary]==3.3.9",
  "pydantic-settings==2.16.2",
  "pyyaml==6.0.3",
  "sqlalchemy==2.1.8",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.hatch.build]
artifacts = ["src/formlane/delivery/resources/*.yaml", "src/formlane/delivery/resources/*.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/formlane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
