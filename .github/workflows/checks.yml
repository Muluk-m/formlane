name: Checks

on:
  pull_request:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: /opt/google/chrome/chrome --version
      - run: pnpm test
        env:
          CHROMIUM_EXECUTABLE_PATH: /opt/google/chrome/chrome
      - run: pnpm build
