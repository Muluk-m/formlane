name: Python backend checks

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/compiler/**"
      - "packages/atoms-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main, test]
    paths:
      - "apps/backend/**"
      - "apps/compiler/**"
      - "packages/atoms-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/python-checks.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: formlane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}@127.0.0.1:5432/formlane_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}@127.0.0.1:5432/formlane_test
      COMPILER_COMMAND: '["node", "${{ github.workspace }}/apps/compiler/dist/index.js"]'
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @formlane/compiler build
      - run: uv sync --frozen --project apps/backend
      - name: Install SDK-matched sandboxed Chromium
        run: |
          uv run --project apps/backend playwright install chromium --no-shell
          browser_executable="$(uv run --project apps/backend python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          printf '%s\n' "BROWSER_EXECUTABLE_PATH=$browser_executable" >> "$GITHUB_ENV"
          # Ubuntu restricts user namespaces by executable; retain Chromium's sandbox.
          sudo tee /etc/apparmor.d/formlane-ci-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile formlane-ci-chromium "$browser_executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/formlane-ci-chromium
      - run: uv run --project apps/backend ruff check apps/backend
      - name: Frozen Flow behavior equivalence
        run: uv run --project apps/backend pytest apps/backend/tests/test_flow_equivalence.py
      - name: Native CrewAI upgrade contracts
        run: uv run --project apps/backend pytest apps/backend/tests/test_runtime_contract.py
      - name: DBOS recovery and execution compatibility gates
        run: >-
          uv run --project apps/backend pytest
          apps/backend/tests/test_durable_execution.py
          apps/backend/tests/test_execution_compatibility.py
      - name: Complete remaining backend regressions
        run: >-
          uv run --project apps/backend pytest apps/backend/tests
          --ignore=apps/backend/tests/test_flow_equivalence.py
          --ignore=apps/backend/tests/test_runtime_contract.py
          --ignore=apps/backend/tests/test_durable_execution.py
          --ignore=apps/backend/tests/test_execution_compatibility.py
