name: Python backend checks

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/compiler/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/ui/**"
      - "packages/i18n/**"
      - "packages/atoms-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main, test]
    paths:
      - "apps/backend/**"
      - "apps/compiler/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/ui/**"
      - "packages/i18n/**"
      - "packages/atoms-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/python-checks.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: formlane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}@127.0.0.1:5432/formlane_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}@127.0.0.1:5432/formlane_test
      BROWSER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      FORMLANE_CHROME_VERSION: "156.0.8078.79"
      COMPILER_COMMAND: '["node", "${{ github.workspace }}/apps/compiler/dist/index.js"]'
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @formlane/compiler build
      - run: uv sync --frozen --project apps/backend
      - run: uv run --project apps/backend ruff check apps/backend apps/compiler/tests apps/web/tests
      - name: Install qualified runtime Chrome
        run: |
          archive="$RUNNER_TEMP/formlane-chrome.deb"
          curl --fail --show-error --silent --location \
            "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_${FORMLANE_CHROME_VERSION}-1_amd64.deb" \
            --output "$archive"
          sudo dpkg --install "$archive"
          test "$("$BROWSER_EXECUTABLE_PATH" --version | awk '{print $3}')" = "$FORMLANE_CHROME_VERSION"
      - name: Prepare runner Chrome files
        run: |
          # Materialize cold image pages before the existing bounded browser launch.
          find /opt/google/chrome -type f -exec cat {} + > /dev/null
          "$BROWSER_EXECUTABLE_PATH" --version
      - name: Diagnose native iframe clicks
        run: |
          uv run --project apps/backend python - <<'PY'
          import asyncio, importlib.util, json, os
          from pathlib import Path
          from types import SimpleNamespace
          import formlane.validator as v
          spec = importlib.util.spec_from_file_location('parity', Path('apps/compiler/tests/test_editor_artifacts.py'))
          t = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(t)
          cases = []
          t.assert_browser = lambda html, checks: cases.append((html, checks))
          t.test_editor_artifacts_map_rendered_instances_and_preserve_canonical_interactions('vanilla')
          original = v._act
          async def observe(session, action):
              await original(session, action)
              print(json.dumps(await session.frame.evaluate('()=>({events:window.clickProbe,value:document.querySelector("output").textContent,handler:!!document.querySelector("button").onclick,ready:document.readyState})')), flush=True)
          v._act = observe
          async def main():
              for trial in range(10):
                  for kind, (html, checks) in enumerate(cases):
                      instrumentation = '<script>window.clickProbe=[];for(const type of ["pointerdown","pointerup","click"])document.addEventListener(type,e=>clickProbe.push({type,target:e.target.tagName,trusted:e.isTrusted,x:e.clientX,y:e.clientY,value:document.querySelector("output")?.textContent}),true)</script>'
                      html = html.replace('<head>', '<head>'+instrumentation, 1)
                      report = await v._run_browser(html, v.validate_checks(checks), SimpleNamespace(browser_executable=os.environ['BROWSER_EXECUTABLE_PATH']), lambda:False, {'issues':[], 'checks':[]})
                      print(json.dumps({'trial':trial, 'kind':kind, **report}), flush=True)
          asyncio.run(main())
          PY
      - name: Recorded acceptance and iteration contracts
        run: uv run --project apps/backend pytest apps/backend/tests/test_flow_equivalence.py apps/backend/tests/test_iteration.py
      - name: Native CrewAI upgrade contracts
        run: uv run --project apps/backend pytest apps/backend/tests/test_runtime_contract.py
      - name: DBOS recovery and execution compatibility gates
        run: >-
          uv run --project apps/backend pytest
          apps/backend/tests/test_durable_execution.py
          apps/backend/tests/test_execution_compatibility.py
      - name: Compiler and preview selection browser boundaries
        run: >-
          uv run --project apps/backend pytest
          apps/compiler/tests/test_editor_artifacts.py
          apps/web/tests/test_preview_selection.py
      - name: Complete remaining backend regressions
        run: >-
          uv run --project apps/backend pytest apps/backend/tests
          --ignore=apps/backend/tests/test_flow_equivalence.py
          --ignore=apps/backend/tests/test_iteration.py
          --ignore=apps/backend/tests/test_runtime_contract.py
          --ignore=apps/backend/tests/test_durable_execution.py
          --ignore=apps/backend/tests/test_execution_compatibility.py
      - name: Owned workspace selection browser scenarios
        run: uv run --project apps/backend python apps/web/tests/run_selection_workspace.py
      - name: Development selection lifecycle
        run: >-
          uv run --project apps/backend python apps/web/tests/run_selection_workspace.py
          --dev --pytest-args -k test_edit_keeps_live_scene_and_attachment_replacement_keeps_comment
